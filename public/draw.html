<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Wobbel: tekenen</title>
    <link rel="stylesheet" href="/shared/base.css" />
    <style>
      /* Icons: one line style for all buttons. */
      button svg {
        display: block;
        width: 40px;
        height: 40px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2.2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .icon {
        position: fixed;
        z-index: 2;
        min-width: 0;
        min-height: 0;
        width: 72px;
        height: 72px;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #undo {
        left: 14px;
        top: 8px;
      }
      /* Back to the previous step: just left of the step indicators. */
      #back {
        left: calc(50% - 146px - 88px);
        top: 8px;
      }
      /* Next step: dark, top right. */
      #next {
        right: 14px;
        top: 8px;
        width: 110px;
        color: #fff;
        background: #222;
      }
      #next svg {
        width: 52px;
        height: 52px;
        stroke-width: 3;
      }
      /* Bin: in the top bar, far from Undo. Hold it: the ring fills up. */
      #clear {
        right: 150px;
        top: 8px;
        /* While it is held, the button fills up from the bottom. */
        background: linear-gradient(to top, #999 calc(var(--p, 0) * 1%), #fff 0);
      }
      #clear span {
        display: flex;
      }
      /* Progress: one indicator per step. */
      #steps {
        position: fixed;
        left: 50%;
        top: 12px;
        transform: translateX(-50%);
        display: flex;
        gap: 12px;
        z-index: 2;
      }
      /* A line connects the steps. */
      #steps::before {
        content: '';
        position: absolute;
        left: 10px;
        right: 10px;
        top: 50%;
        height: 4px;
        margin-top: -2px;
        background: #bbb;
        z-index: -1;
      }
      #steps button {
        min-width: 0;
        min-height: 0;
        width: 64px;
        height: 64px;
        padding: 0;
        border-color: #bbb;
        color: #bbb;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
      }
      #steps svg {
        width: 38px;
        height: 38px;
      }
      #steps button.done {
        border-color: #222;
        color: #222;
        pointer-events: auto;
      }
      #steps button.current {
        border-color: #222;
        background: #222;
        color: #fff;
      }
      /* Step 1: colours and tools.
         Portrait: two rows at the bottom. Landscape: colours left, tools right. */
      .panel {
        position: fixed;
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
        gap: 10px;
        z-index: 2;
        pointer-events: none;
      }
      #colors {
        bottom: 74px;
      }
      #tools {
        bottom: 6px;
      }
      /* Tools: pencil, eraser, fill. Then the three line widths. */
      #tools .width:first-of-type,
      #tools .tool + .width {
        margin-left: 24px;
      }
      body.land .panel {
        top: 88px;
        bottom: 0;
        width: var(--side);
        display: grid;
        grid-template-columns: 62px 62px;
        gap: 14px;
        justify-content: center;
        align-content: center;
      }
      body.land #tools {
        grid-template-columns: 62px 62px 62px;
        row-gap: 28px;
      }
      body.land #tools .width {
        margin-left: 0;
      }
      body.land #colors {
        right: auto;
      }
      body.land #tools {
        left: auto;
      }
      .panel button {
        pointer-events: auto;
        min-width: 0;
        min-height: 0;
        width: 62px;
        height: 62px;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #colors .rainbow {
        background: conic-gradient(#e53935, #fdd835, #43a047, #1e88e5, #8e24aa, #e53935);
      }
      .panel button.selected {
        box-shadow: 0 0 0 3px #fff, 0 0 0 7px #222;
      }
      /* The selected tool is also dark, so it is clear which one is active. */
      #tools .tool.selected {
        background: #222;
        color: #fff;
      }
      /* Step 3: one big send button. */
      #send {
        left: 50%;
        bottom: 22px;
        margin-left: -100px;
        width: 200px;
        height: 96px;
        color: #fff;
        background: #222;
      }
      body.land #send {
        left: auto;
        right: calc(var(--side) / 2 - 100px);
        bottom: auto;
        top: 50%;
        margin: -48px 0 0 0;
      }
      #send svg {
        width: 64px;
        height: 64px;
        stroke-width: 2;
      }
      .pulse {
        animation: pulse 1.1s ease-in-out infinite;
      }
      @keyframes pulse {
        50% {
          transform: scale(1.12);
        }
      }
      /* The hand that shows where to tap. Its fingertip is at (left, top). */
      #hand {
        position: fixed;
        z-index: 6;
        width: 84px;
        height: 84px;
        margin: 24px 0 0 4px; /* 30 px to the bottom right of the target, so the icon stays visible */
        pointer-events: none;
      }
      #hand svg,
      #idle svg {
        width: 100%;
        height: 100%;
        fill: #fff;
        stroke: #222;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      #hand.tap {
        animation: tap 1.2s ease-in-out infinite;
      }
      #hand.draw {
        animation: scribble 2.4s ease-in-out infinite;
      }
      @keyframes tap {
        0%, 100% {
          transform: translate(26px, 34px);
        }
        45%, 60% {
          transform: translate(0, 0) scale(0.9);
        }
      }
      @keyframes scribble {
        0%, 100% {
          transform: translate(-70px, 20px);
        }
        25% {
          transform: translate(-25px, -40px);
        }
        50% {
          transform: translate(20px, 25px);
        }
        75% {
          transform: translate(65px, -30px);
        }
      }
      /* Nobody touched the screen for a minute: a ring runs out before everything is cleared.
         Any touch stops it. */
      #idle {
        position: fixed;
        left: 50%;
        top: 50%;
        width: 220px;
        height: 220px;
        margin: -110px 0 0 -110px;
        border-radius: 40px;
        background: conic-gradient(#222 calc(var(--left, 100) * 1%), #ddd 0);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 7;
        pointer-events: none;
      }
      #idle span {
        width: 180px;
        height: 180px;
        border-radius: 24px;
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #idle svg {
        width: 96px;
        height: 96px;
        animation: tap 1.2s ease-in-out infinite;
      }
      #message {
        position: fixed;
        left: 0;
        right: 0;
        top: 30%;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 24px;
        z-index: 3;
        pointer-events: none;
      }
      #message svg {
        width: 140px;
        height: 140px;
        fill: none;
        stroke: #222;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      #retry {
        position: fixed;
        left: 50%;
        top: 100px;
        margin-left: -48px;
        width: 96px;
        height: 96px;
        padding: 0;
        z-index: 8;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #retry svg {
        width: 56px;
        height: 56px;
      }
      /* The connection dot only shows when the connection is lost. */
      #status-dot:not(.off) {
        display: none;
      }
      #status-dot.off {
        width: 22px;
        height: 22px;
        border-width: 4px;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <button id="undo" class="icon" aria-label="Stap terug" hidden></button>
    <button id="back" class="icon" aria-label="Vorige stap" hidden></button>
    <div id="steps"></div>
    <button id="clear" class="icon" aria-label="Alles wissen (ingedrukt houden)" hidden></button>
    <button id="next" class="icon" aria-label="Volgende stap" hidden></button>
    <div id="colors" class="panel" hidden></div>
    <div id="tools" class="panel" hidden></div>
    <button id="send" class="icon pulse" aria-label="Versturen" hidden></button>
    <button id="retry" aria-label="Opnieuw proberen" hidden></button>
    <div id="message" hidden></div>
    <div id="idle" hidden></div>
    <div id="hand" hidden></div>

    <script src="/shared/stickers.js"></script>
    <script src="/shared/wobbel.js"></script>
    <script src="/shared/api.js"></script>
    <script src="/shared/hooks.js"></script>
    <script src="/draw.js"></script>
  </body>
</html>
