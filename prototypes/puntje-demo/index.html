<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Puntje – animations</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="wrap">
      <div id="game"></div>
      <div id="info" aria-live="polite">loading…</div>
      <div id="tracker" title="Femto Bolt tracker (ws://localhost:8765)"><span class="dot"></span><span class="txt">tracker</span></div>
      <div id="message" hidden></div>
    </div>

    <div id="bar">
      <div class="group anims" id="buttons"></div>

      <div class="group controls">
        <button class="tool" id="pause" type="button" aria-label="Pause" title="Pause (space)">
          <svg class="i-pause" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg>
          <svg class="i-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5Z"/></svg>
        </button>

        <button class="tool" id="force-loop" type="button" aria-pressed="false" aria-label="Force loop" title="Force loop: one-shots repeat too">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>
        </button>

        <label class="speed" title="Speed">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 14l4-4"/><path d="M3.3 19a10 10 0 1 1 17.4 0"/></svg>
          <input id="speed" type="range" min="0.25" max="2" step="0.05" value="1" aria-label="Speed" />
          <output id="speed-value">1×</output>
        </label>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
