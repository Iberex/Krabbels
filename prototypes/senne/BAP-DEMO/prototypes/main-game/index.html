<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Krabbels</title>
  <!-- Fonts: Lilita One for the KRABBELS logo and numbers, Fredoka for the rest -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Lilita+One&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Webcam feed. Hidden: we draw it onto the canvas ourselves (mirrored + dimmed). -->
  <video id="webcam" playsinline muted autoplay></video>

  <!-- Everything visible is drawn on this one canvas. -->
  <canvas id="game"></canvas>

  <!-- Readable messages (loading, camera blocked, model failed...). -->
  <div id="message" class="visible">Loading…</div>

  <!-- Opening index.html straight from disk (file://) blocks ES modules and the webcam.
       This tiny non-module script makes sure you get a clear message instead of a blank page. -->
  <script>
    if (location.protocol === "file:") {
      document.getElementById("message").innerHTML =
        "<strong>Open this page through a local server.</strong><br>" +
        "In VS Code: right-click index.html → <em>Open with Live Server</em>.<br>" +
        "Opening the file directly (file://) blocks the camera and the scripts.";
    }
  </script>

  <script type="module" src="main.js"></script>
<a class="krabbels-overzicht" href="../../" title="Terug naar het overzicht">← overzicht</a><style>.krabbels-overzicht{position:fixed;left:12px;bottom:12px;z-index:99999;font:600 13px/1 Inter,system-ui,-apple-system,'Segoe UI',sans-serif;color:#fff;background:rgba(34,34,34,.72);padding:8px 12px;border-radius:999px;text-decoration:none;opacity:.55}.krabbels-overzicht:hover{opacity:1}</style>
</body>
</html>
