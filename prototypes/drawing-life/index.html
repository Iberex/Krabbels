<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Krabbels · Drawing Life</title>
  <!-- Same fonts as the level prototype: Lilita One for display, Fredoka for the rest -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Lilita+One&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- The paper world. The Krabbels live here. -->
  <canvas id="world" class="layer"></canvas>

  <!-- Screen 1: the drawing sheet and big icon tools (no text: 6-year-olds can't read). -->
  <section id="drawScreen">
    <button id="closeBtn" class="corner" aria-label="Back to the world">
      <svg viewBox="0 0 48 48" fill="none" stroke="#1f2340" stroke-width="4" stroke-linecap="round"><path d="M15 15 L33 33 M33 15 L15 33" /></svg>
    </button>

    <div id="sheet">
      <!-- A gentle hint of where to draw. Not a template. -->
      <svg id="hint" viewBox="0 0 100 100" aria-hidden="true"><circle id="hintCircle" cx="50" cy="50" r="34" /></svg>
      <canvas id="drawCanvas"></canvas>
      <span class="tape tape-left"></span>
      <span class="tape tape-right"></span>
    </div>

    <div id="toolbar">
      <div id="colors" class="group"></div>
      <div id="sizes" class="group"></div>
      <div id="tools" class="group">
        <button id="eraserBtn" class="tool" aria-label="Eraser">
          <svg viewBox="0 0 48 48" fill="none" stroke="#1f2340" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 30.5 L23.5 14 a4 4 0 0 1 5.7 0 l7 7 a4 4 0 0 1 0 5.7 L25 38 H14.5 z" fill="#ff8ab3" />
            <path d="M7 30.5 L14.5 38 H25 L29 34 L18.5 23.5 z" fill="#fdfcf6" />
            <path d="M25 38 H41" />
          </svg>
        </button>
        <button id="undoBtn" class="tool" aria-label="Undo">
          <svg viewBox="0 0 48 48" fill="none" stroke="#1f2340" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 11 L9 19 L17 27" />
            <path d="M9 19 H28 a9.5 9.5 0 0 1 0 19 H19" />
          </svg>
        </button>
        <button id="clearBtn" class="tool" aria-label="Clear">
          <svg viewBox="0 0 48 48" fill="none" stroke="#1f2340" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M13 14 L15.5 38.5 a3 3 0 0 0 3 2.5 H29.5 a3 3 0 0 0 3 -2.5 L35 14" fill="#fdfcf6" />
            <path d="M9 14 H39" />
            <path d="M19 14 V9.5 H29 V14" />
            <path d="M20.5 20 V34 M27.5 20 V34" />
          </svg>
        </button>
        <button id="scanBtn" class="tool" aria-label="Scan a paper drawing" hidden>
          <svg viewBox="0 0 48 48" fill="none" stroke="#1f2340" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 17 a3 3 0 0 1 3 -3 h6 l3 -4 h10 l3 4 h6 a3 3 0 0 1 3 3 v18 a3 3 0 0 1 -3 3 H10 a3 3 0 0 1 -3 -3 z" fill="#fdfcf6" />
            <circle cx="24" cy="24.5" r="7" fill="#7ad7ff" />
          </svg>
        </button>
      </div>

      <!-- Optional timer: a yellow circle that shrinks (CONFIG.timer). -->
      <div id="timer" hidden>
        <svg viewBox="0 0 48 48">
          <circle cx="24" cy="24" r="21" fill="none" stroke="#1f2340" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="3 4" />
          <circle id="timerFill" cx="24" cy="24" r="18" fill="#fdc73a" />
        </svg>
      </div>

      <button id="doneBtn" aria-label="Done">
        <svg viewBox="0 0 48 48" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 25 L20.5 33.5 L36 15" /></svg>
      </button>
    </div>
  </section>

  <!-- Screen 2 buttons: a new drawing (pencil +) and a sticker of the newest Krabbel. -->
  <div id="worldUi" class="hidden">
    <button id="stickerBtn" class="round" aria-label="Sticker">
      <svg viewBox="0 0 48 48" fill="none" stroke="#1f2340" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 12 a3 3 0 0 1 3 -3 H35 a3 3 0 0 1 3 3 V28 L28 38 H13 a3 3 0 0 1 -3 -3 Z" fill="#ffffff" />
        <path d="M38 28 H31 a3 3 0 0 0 -3 3 V38" fill="#e8e3d3" />
        <polygon points="23,14 25.1,19.1 30.6,19.5 26.4,23.1 27.7,28.5 23,25.6 18.3,28.5 19.6,23.1 15.4,19.5 20.9,19.1" fill="#fdc73a" stroke-width="2" />
      </svg>
    </button>
    <button id="newBtn" class="round big" aria-label="New drawing">
      <svg viewBox="0 0 64 64" fill="none" stroke="#1f2340" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 50 L17.5 39 L41 15.5 L48.5 23 L25 46.5 Z" fill="#fdfcf6" />
        <path d="M14 50 L17.5 39 L25 46.5 Z" fill="#f2d3a0" />
        <path d="M14 50 l1.6 -5 l3.4 3.4 z" fill="#1f2340" />
        <path d="M37 19.5 L44.5 27" />
        <circle cx="46" cy="46" r="11" fill="#4cc38a" />
        <path d="M46 40 V52 M40 46 H52" stroke="#ffffff" stroke-width="4" />
      </svg>
    </button>
  </div>

  <!-- On top of everything: the drawing flying into the world, and its sparkle trail. -->
  <canvas id="fx" class="layer"></canvas>

  <!-- Optional phase 2: scan a paper drawing with the camera (CONFIG.enableScan). -->
  <section id="scanScreen" hidden>
    <video id="scanVideo" playsinline muted autoplay></video>
    <div id="scanFrame"></div>
    <div id="scanHint">
      <svg viewBox="0 0 48 48" fill="none" stroke="#1f2340" stroke-width="3" stroke-linejoin="round"><rect x="11" y="7" width="26" height="34" rx="2" fill="#ffffff" /><path d="M17 26 q4 -8 7 0 t7 0" stroke="#f04e45" stroke-linecap="round" /></svg>
      <span>Hold your drawing inside the frame</span>
    </div>
    <button id="scanClose" class="corner" aria-label="Close the camera">
      <svg viewBox="0 0 48 48" fill="none" stroke="#1f2340" stroke-width="4" stroke-linecap="round"><path d="M15 15 L33 33 M33 15 L15 33" /></svg>
    </button>
    <button id="captureBtn" aria-label="Take the picture">
      <svg viewBox="0 0 48 48" fill="none" stroke="#1f2340" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M7 17 a3 3 0 0 1 3 -3 h6 l3 -4 h10 l3 4 h6 a3 3 0 0 1 3 3 v18 a3 3 0 0 1 -3 3 H10 a3 3 0 0 1 -3 -3 z" fill="#fdfcf6" />
        <circle cx="24" cy="24.5" r="7" fill="#7ad7ff" />
      </svg>
    </button>
  </section>

  <!-- Debug (D): numbers, and the colour + black-and-white sticker side by side. -->
  <pre id="debugInfo"></pre>
  <div id="stickerPanel"></div>

  <!-- Readable messages (errors, camera…). Tap to close. -->
  <div id="message"></div>

  <!-- Opening index.html straight from disk (file://) blocks ES modules. Say so instead of a blank page. -->
  <script>
    if (location.protocol === "file:") {
      var m = document.getElementById("message");
      m.className = "visible error";
      m.innerHTML =
        "<strong>Open this page through a local server.</strong><br>" +
        "In VS Code: right-click index.html → <em>Open with Live Server</em>.";
    }
  </script>
  <script type="module" src="main.js"></script>
<a class="krabbels-overzicht" href="../../" title="Terug naar het overzicht">← overzicht</a><style>.krabbels-overzicht{position:fixed;left:12px;bottom:12px;z-index:99999;font:600 13px/1 Inter,system-ui,-apple-system,'Segoe UI',sans-serif;color:#fff;background:rgba(34,34,34,.72);padding:8px 12px;border-radius:999px;text-decoration:none;opacity:.55}.krabbels-overzicht:hover{opacity:1}</style>
</body>
</html>
